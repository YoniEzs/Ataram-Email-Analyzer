name: Release Desktop Builds

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/src/**'
      - 'packaging/**'
      - 'scripts/sync_webui.py'
      - '.github/workflows/release-desktop.yml'
  workflow_dispatch:

# Deny token permissions by default. Jobs opt in only to what they require.
permissions: {}

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-prod.txt

      - name: Install build dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements-prod.txt waitress==3.0.2 pyinstaller==6.11.1 backports.tarfile

      - name: Bundle web UI and YARA rules into the package
        run: python scripts/sync_webui.py

      - name: Build bundle
        run: pyinstaller --noconfirm --log-level WARN --distpath dist --workpath build packaging/ataram.spec

      - name: Smoke test the built binary
        shell: bash
        env:
          ITGALYA_NO_BROWSER: '1'
          ITGALYA_PORT: '8321'
          PYTHONUNBUFFERED: '1'
        run: |
          BIN=dist/ITgalyaEmailAnalyzer/ITgalyaEmailAnalyzer
          [ "$RUNNER_OS" = "Windows" ] && BIN="$BIN.exe"

          "./$BIN" > app.log 2>&1 &
          APP_PID=$!

          URL=""
          for _ in $(seq 1 30); do
            URL=$(grep -oE 'http://127\.0\.0\.1:[0-9]+' app.log | head -1 || true)
            if [ -n "$URL" ] && curl -sf "$URL/health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "The application never reported a URL. Its output was:"
            cat app.log
            exit 1
          fi
          echo "Serving at $URL"

          curl -fsS "$URL/health"
          curl -fsS "$URL/" | grep -Eqi 'itgalya|email analyzer'
          curl -fsS -F emailfile=@samples/02-display-name-spoof.eml \
            "$URL/api/v1/analyze" | grep -q risk_assessment

          if [ "$RUNNER_OS" = "Windows" ]; then
            taskkill //IM ITgalyaEmailAnalyzer.exe //F >/dev/null 2>&1 || true
          else
            kill "$APP_PID" 2>/dev/null || true
          fi

      - name: Package archive
        shell: bash
        run: |
          cd dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          ARCHIVE="ITgalyaEmailAnalyzer-${VERSION//\//-}-${{ matrix.label }}.zip"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$ARCHIVE" ITgalyaEmailAnalyzer >/dev/null
          else
            zip -qr "$ARCHIVE" ITgalyaEmailAnalyzer
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
          cat "$ARCHIVE.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  provenance:
    name: Attest release provenance
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest desktop archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'artifacts/*.zip'

  release:
    name: Attach to GitHub Release
    needs: [build, provenance]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
