name: Release Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Verify backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check --no-cache app tests
          mypy
          pytest -q --cov=app --cov-report=term --cov-fail-under=80
          pip-audit -r requirements-prod.txt

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend syntax
        working-directory: frontend
        run: |
          npm ci
          npm run check

  backend:
    name: Backend image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build local scan target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          load: true
          tags: backend-scan-target:latest

      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: backend-scan-target:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: backend-scan-target:latest
          format: cyclonedx-json
          output-file: backend-sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-sbom
          path: backend-sbom.cdx.json
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned deliberately. The installer's own default moved from Cosign
          # v2.5.2 to v3.0.6 in this bump, and v3 changes the signature bundle
          # format that `cosign sign` writes -- so an unpinned upgrade would
          # silently change what a released image is signed with, on a path
          # that has never actually run. Staying on the v2 line keeps the
          # first real release identical to what this workflow was written
          # and reviewed against. Moving to v3 is a one-line change here,
          # worth making once someone has verified an image end to end.
          cosign-release: 'v2.6.5'

      - name: Sign image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # OCI repository names must be lowercase, but github.repository
          # preserves the owner/repo casing this repo happens to use.
          # metadata-action lowercases the push tags for us; this run step
          # has to do it itself or cosign rejects the reference.
          IMAGE="${REGISTRY}/${IMAGE_NAME_BACKEND}"
          cosign sign --yes "${IMAGE,,}@${DIGEST}"

  frontend:
    name: Frontend image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build local scan target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          load: true
          tags: frontend-scan-target:latest

      - name: Scan image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: frontend-scan-target:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: frontend-scan-target:latest
          format: cyclonedx-json
          output-file: frontend-sbom.cdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-sbom
          path: frontend-sbom.cdx.json
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned deliberately. The installer's own default moved from Cosign
          # v2.5.2 to v3.0.6 in this bump, and v3 changes the signature bundle
          # format that `cosign sign` writes -- so an unpinned upgrade would
          # silently change what a released image is signed with, on a path
          # that has never actually run. Staying on the v2 line keeps the
          # first real release identical to what this workflow was written
          # and reviewed against. Moving to v3 is a one-line change here,
          # worth making once someone has verified an image end to end.
          cosign-release: 'v2.6.5'

      - name: Sign image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # OCI repository names must be lowercase, but github.repository
          # preserves the owner/repo casing this repo happens to use.
          # metadata-action lowercases the push tags for us; this run step
          # has to do it itself or cosign rejects the reference.
          IMAGE="${REGISTRY}/${IMAGE_NAME_FRONTEND}"
          cosign sign --yes "${IMAGE,,}@${DIGEST}"
