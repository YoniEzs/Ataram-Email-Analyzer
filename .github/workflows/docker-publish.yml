name: Docker Publish

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build Backend image (local, for scanning)
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        load: true
        tags: backend-scan-target:latest
        labels: ${{ steps.meta.outputs.labels }}

    - name: Scan image for vulnerabilities (Trivy)
      uses: aquasecurity/trivy-action@0.29.0
      with:
        image-ref: backend-scan-target:latest
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
        ignore-unfixed: true

    - name: Push Backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  build-and-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build Frontend image (local, for scanning)
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        load: true
        tags: frontend-scan-target:latest
        labels: ${{ steps.meta.outputs.labels }}

    - name: Scan image for vulnerabilities (Trivy)
      uses: aquasecurity/trivy-action@0.29.0
      with:
        image-ref: frontend-scan-target:latest
        format: table
        exit-code: '1'
        severity: CRITICAL,HIGH
        ignore-unfixed: true

    - name: Push Frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
