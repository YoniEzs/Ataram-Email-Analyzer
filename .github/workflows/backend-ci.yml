name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/src/index.html'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/src/index.html'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.15.1

      - name: Lint with Ruff
        working-directory: backend
        run: python -m ruff check --no-cache app tests

      - name: Run tests
        working-directory: backend
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SECRET_KEY: test-secret-key-not-for-production
          FLASK_ENV: testing
        run: pytest -q

  docker:
    name: Backend Docker smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: backend
        run: docker build -t email-analyzer-backend:${{ github.sha }} .

      - name: Run container health check
        run: |
          docker run -d --name test-backend \
            -p 5000:5000 \
            -e SECRET_KEY=test-key-not-for-production \
            -e FLASK_ENV=production \
            email-analyzer-backend:${{ github.sha }}

          for i in {1..20}; do
            if curl -fsS http://localhost:5000/health; then
              docker stop test-backend
              exit 0
            fi
            sleep 2
          done

          docker logs test-backend
          docker stop test-backend
          exit 1
