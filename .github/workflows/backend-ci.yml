name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/src/index.html'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/src/index.html'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements-prod.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with Ruff
        working-directory: backend
        run: python -m ruff check --no-cache app tests

      - name: Type-check with mypy
        working-directory: backend
        run: python -m mypy

      - name: Run tests with coverage floor
        working-directory: backend
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SECRET_KEY: test-secret-key-not-for-production
          FLASK_ENV: testing
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=65

  docker:
    name: Backend Docker smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        run: docker build -t email-analyzer-backend:${{ github.sha }} backend

      - name: Verify image contents
        run: |
          docker run --rm --entrypoint sh email-analyzer-backend:${{ github.sha }} -c '
            test ! -e /app/.env &&
            test ! -d /app/tests &&
            test ! -d /app/.git &&
            test ! -e /app/requirements-dev.txt
          '

      - name: Run container health check
        run: |
          docker run -d --name test-backend \
            -p 127.0.0.1:5000:5000 \
            -e SECRET_KEY=test-key-not-for-production \
            -e FLASK_ENV=production \
            -e FORCE_HTTPS=false \
            email-analyzer-backend:${{ github.sha }}

          cleanup() {
            docker logs test-backend || true
            docker rm -f test-backend || true
          }
          trap cleanup EXIT

          for _ in {1..30}; do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
