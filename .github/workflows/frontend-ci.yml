name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'backend/tests/test_frontend_dom_contract.py'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/tests/test_frontend_dom_contract.py'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate JavaScript syntax
        run: node --check frontend/src/js/*.js

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pytest for DOM contract test
        working-directory: backend
        run: python -m pip install pytest==8.3.3

      - name: Run frontend DOM contract test
        working-directory: backend
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: pytest tests/test_frontend_dom_contract.py -q

  serve-smoke-test:
    name: Static serving smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Serve frontend and check key assets
        run: |
          python -m http.server 3000 --directory frontend/src &
          server_pid=$!
          trap 'kill $server_pid' EXIT

          for i in {1..10}; do
            if curl -fsS http://localhost:3000/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:3000/ >/dev/null
          curl -fsS http://localhost:3000/css/styles.css >/dev/null
          curl -fsS http://localhost:3000/js/app.js >/dev/null

  docker:
    name: Frontend Docker smoke test
    runs-on: ubuntu-latest
    needs: [static-checks, serve-smoke-test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: frontend
        run: docker build -t email-analyzer-frontend:${{ github.sha }} .

      - name: Run container health check
        run: |
          docker run -d --name test-frontend \
            -p 8080:80 \
            email-analyzer-frontend:${{ github.sha }}

          for i in {1..10}; do
            if curl -fsS http://localhost:8080/health; then
              docker stop test-frontend
              exit 0
            fi
            sleep 1
          done

          docker logs test-frontend
          docker stop test-frontend
          exit 1
