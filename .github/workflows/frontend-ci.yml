name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - 'backend/tests/test_frontend_dom_contract.py'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/tests/test_frontend_dom_contract.py'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static and DOM checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate JavaScript syntax
        working-directory: frontend
        run: npm run check

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Run frontend DOM contract
        working-directory: backend
        run: |
          python -m pip install pytest==9.1.1
          pytest tests/test_frontend_dom_contract.py -q

  browser-smoke:
    name: Playwright browser smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Serve frontend and run smoke test
        env:
          SMOKE_BASE_URL: http://localhost:8765
        run: |
          python3 -m http.server 8765 --directory frontend/src &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for _ in {1..20}; do
            curl -fsS http://localhost:8765/index.html >/dev/null && break
            sleep 1
          done
          npm --prefix frontend run test:e2e

  docker:
    name: Frontend Docker smoke test
    runs-on: ubuntu-latest
    needs: [static-checks, browser-smoke]
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        run: docker build -t email-analyzer-frontend:${{ github.sha }} frontend

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: email-analyzer-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Run container health check
        run: |
          docker run -d --name test-frontend \
            -p 127.0.0.1:8080:80 \
            email-analyzer-frontend:${{ github.sha }}

          cleanup() {
            docker logs test-frontend || true
            docker rm -f test-frontend || true
          }
          trap cleanup EXIT

          for _ in {1..20}; do
            if curl -fsS http://localhost:8080/frontend-health; then
              curl -fsS http://localhost:8080/runtime-config.js >/dev/null
              curl -fsS http://localhost:8080/js/i18n.js >/dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1
