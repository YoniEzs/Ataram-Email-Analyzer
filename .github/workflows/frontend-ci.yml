name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Validate HTML
      uses: Cyb3r-Jak3/html5validator-action@v7.2.0
      with:
        root: frontend/src/
        css: true

    - name: Lint JavaScript
      run: |
        npx eslint frontend/src/js/*.js --no-eslintrc --env browser --parserOptions ecmaVersion:2022

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Test static file serving
      run: |
        cd frontend/src
        npx http-server -p 3000 &
        sleep 5
        curl -f http://localhost:3000/ || exit 1
        curl -f http://localhost:3000/css/styles.css || exit 1
        curl -f http://localhost:3000/js/app.js || exit 1

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      working-directory: ./frontend
      run: |
        docker build -t email-analyzer-frontend:${{ github.sha }} .

    - name: Test Docker image
      run: |
        docker run -d --name test-frontend \
          -p 8080:80 \
          email-analyzer-frontend:${{ github.sha }}
        sleep 5
        curl -f http://localhost:8080/ || exit 1
        docker stop test-frontend
