name: Feature request
description: Propose a scoped defensive-analysis improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What defensive-analysis problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: Trust, privacy and resource impact
      description: Describe new data flows, dependencies, lookups or limits.
    validations:
      required: true
