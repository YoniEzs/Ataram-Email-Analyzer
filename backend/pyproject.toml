[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ataram-email-analyzer"
version = "0.1.0rc1"
description = "Local phishing triage: analyze .eml/.msg files in your browser, on your own machine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ataram Security Platform" }]
keywords = ["dfir", "phishing", "email", "forensics", "eml", "msg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Pins mirror requirements-prod.txt, with gunicorn (containers only; no
# Windows support) swapped for waitress. Keep the two lists in sync.
dependencies = [
    "Flask==3.1.3",
    "flask-cors==6.0.1",
    "flask-talisman==1.1.0",
    "python-dotenv==1.2.2",
    "python-oxmsg==0.0.2",
    "olefile==0.47",
    "dnspython==2.7.0",
    "requests==2.33.0",
    "tldextract==5.3.1",
    "yara-python==4.5.4",
    "dkimpy==1.1.8",
    "beautifulsoup4==4.12.3",
    "lxml==6.1.0",
    "Flask-Limiter==3.8.0",
    "redis==5.2.1",
    "pyspf==2.0.14",
    "waitress==3.0.2",
]

[project.urls]
Homepage = "https://github.com/YoniEzs/Ataram-Email-Analyzer"
Documentation = "https://github.com/YoniEzs/Ataram-Email-Analyzer#readme"

[project.scripts]
ataram-analyzer = "app.desktop:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "data/**/*.json",
    "webui/**/*",
    "bundled_yara/*",
]
