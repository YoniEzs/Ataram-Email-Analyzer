[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ataram-email-analyzer"
version = "0.1.0rc1"
description = "Local phishing triage: analyze .eml/.msg files in your browser, on your own machine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ataram Security Platform" }]
keywords = ["dfir", "phishing", "email", "forensics", "eml", "msg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Pins mirror requirements-prod.txt, with gunicorn (containers only; no
# Windows support) swapped for waitress. Keep the two lists in sync.
dependencies = [
    "Flask==3.1.3",
    "flask-cors==6.0.5",
    "flask-talisman==1.1.0",
    "python-dotenv==1.2.3",
    "python-oxmsg==0.0.2",
    "olefile==0.47",
    "dnspython==2.8.0",
    "requests==2.34.2",
    "tldextract==5.3.2",
    "yara-python==4.5.4",
    "dkimpy==1.1.8",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "Flask-Limiter==4.1.1",
    "redis==8.1.0",
    "pyspf==2.0.14",
    "waitress==3.0.2",
]

[project.urls]
Homepage = "https://github.com/YoniEzs/Ataram-Email-Analyzer"
Documentation = "https://github.com/YoniEzs/Ataram-Email-Analyzer#readme"

[project.scripts]
ataram-analyzer = "app.desktop:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "data/**/*.json",
    "webui/**/*",
    "bundled_yara/*",
]

[tool.pytest.ini_options]
# The coverage floor used to exist only as a --cov-fail-under flag repeated in
# five places (two workflows, RELEASE_CHECKLIST.md and two READMEs). A bare
# `pytest` therefore ran with no gate at all, and the copies could drift apart.
# Declaring it here makes plain `pytest` enforce the same floor CI does; the
# explicit flag in the workflows stays as documentation of intent.
#
# The floor is 80, not the historical 65: measured coverage is 86%, so 65 had
# stopped being a gate and would have let a third of the codebase go dark
# without failing. Raise this as coverage improves; never lower it to make a
# change fit.
addopts = "--cov=app --cov-report=term --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff.lint]
# Pin the enforced ruleset explicitly. ruff 0.16 widened its defaults (UP,
# BLE, PL, ...), several of which argue with deliberate choices here: blanket
# excepts implement the documented degrade-to-None lookup philosophy, and
# bidirectional-Unicode literals are the Hebrew/bidi test corpus. This is the
# classic pycodestyle+pyflakes set the project has always enforced; widening
# it is welcome as a deliberate change, not as tool drift.
select = ["E4", "E7", "E9", "F"]
