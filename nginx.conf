# Standalone frontend image config — serves the static site only, with no
# backend to proxy to. Kept in security parity with deploy/nginx.conf; if you
# change the header set in one, change it in the other.
#
# This file was previously the unhardened original (no CSP, no HSTS,
# X-Frame-Options SAMEORIGIN, the deprecated X-XSS-Protection filter), which
# meant any deployment built from ataram-frontend/Dockerfile shipped none of the
# protections the main deployment has.

limit_req_zone $binary_remote_addr zone=static:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=static_conn:10m;

server_tokens off;

server {
    # 8080, not 80: the image runs nginx as an unprivileged user, which cannot
    # bind a port below 1024. Map it on the host side (-p 80:8080) if needed.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Slowloris defence.
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;
    client_max_body_size 1m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    limit_conn static_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    # Static hosting serves no state-changing verbs.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
        return 405;
    }

    # --- Security headers -------------------------------------------------
    # script-src 'self' with no 'unsafe-inline' is the important one: the
    # results renderer builds HTML from values taken out of an
    # attacker-supplied email.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Never serve dotfiles, VCS metadata or editor leftovers.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(git|env|bak|swp|orig|log|ini|conf|yml|yaml|toml)$ {
        deny all;
        return 404;
    }

    # Health check endpoint (exact match, so it cannot shadow a real path).
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Cache static assets. An add_header here REPLACES the server-level set, so
    # every header is repeated rather than inherited.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 1h;
        add_header Cache-Control "public";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Main location
    location / {
        limit_req zone=static burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
