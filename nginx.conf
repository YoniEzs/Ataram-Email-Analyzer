# Rate/connection limiting zones. These live at http scope; the container's
# main nginx.conf includes this file from inside `http {}`, so they belong here
# alongside the server block.
#
# nginx sees cloudflared as the client, so $binary_remote_addr alone would be a
# single key for the entire internet. Cloudflare's edge sets CF-Connecting-IP to
# the real client and overwrites any value the client supplied, so it is
# trustworthy on this path — and cloudflared validates the Access JWT, so there
# is no other path in.
#
# X-Forwarded-For is deliberately NOT used as a fallback: it is client-supplied
# and would let a caller mint a fresh rate-limit bucket per request. When
# CF-Connecting-IP is absent, fall back to the connection address instead.
# IPv6 must be aggregated to its allocation, not keyed per address. A single
# host is routinely delegated a /64 (every major VPS provider, and most
# consumer ISPs via DHCPv6-PD), which is 2^64 addresses it genuinely owns —
# measured against this app, 60 uploads from one /64 produced zero 429s.
# Because those addresses are really the attacker's, no header validation,
# IP allowlist or JWT check would have stopped it.
#
# nginx has no IP arithmetic, so this is regex truncation over the RFC 5952
# text form Cloudflare sends. The alternatives below cover both the full form
# and the compressed forms; a compressed '::' early in the address means the
# omitted groups are zero, so grouping on the surviving prefix is correct (and
# where it over-groups, it errs toward stricter limiting rather than a bypass).
# Exact per-/64 arithmetic is done in the app layer — see rate_limit_key() in
# ataram-backend/app/__init__.py, which is the enforcing limit.
# The key is the first four groups — the /64 — stopping wherever '::' elides
# the rest. Alternatives are ordered longest-prefix first, because nginx tries
# map regexes in the order they are written.
#
# Verified against RFC 5952 compressed lowercase text, which is the form
# Cloudflare sends (see tests/test_security_ipv6_map.py, which re-runs these
# exact patterns): an earlier version required a hex digit after the fourth
# group and therefore did NOT match `2001:db8:dead:beef::5` — precisely the
# shape a /64-delegated host uses — leaving this layer fully bypassed.
map $http_cf_connecting_ip $limit_key {
    ""                                                                        $binary_remote_addr;
    ~^(?<v6a>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})         $v6a;
    ~^(?<v6b>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4})::                     $v6b;
    ~^(?<v6c>[0-9a-f]{1,4}:[0-9a-f]{1,4})::                                   $v6c;
    ~^(?<v6d>[0-9a-f]{1,4})::                                                 $v6d;
    default                                                                   $http_cf_connecting_ip;
}

# The single value forwarded to the backend as X-Forwarded-For.
#
# This MUST be a single address, not an appended chain. The backend runs
# ProxyFix(x_for=1), which reads the RIGHTMOST entry. With nginx's usual
# $proxy_add_x_forwarded_for the rightmost entry is the cloudflared container's
# address — a constant — so Flask-Limiter keyed every request on earth to one
# bucket and a single client could 429 the entire internet.
#
# Setting exactly one value keeps the rightmost entry equal to the real client
# and leaves no client-supplied position for ProxyFix to read.
map $http_cf_connecting_ip $real_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Analysis is expensive (DNS + WHOIS + parsing), so it gets its own tight zone.
limit_req_zone $limit_key zone=analyze:10m rate=10r/m;
limit_req_zone $limit_key zone=general:10m rate=60r/m;
limit_conn_zone $limit_key zone=conn_per_ip:10m;

# Don't advertise the nginx version in responses or error pages.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Must be >= the backend's MAX_CONTENT_LENGTH (MAX_UPLOAD_MB) or large .msg
    # uploads are rejected by nginx before they ever reach Flask. Lowered from
    # 50m: with request buffering on (below) every upload above
    # client_body_buffer_size lands in a tmpfs, and 50MB x the permitted
    # concurrency does not fit in any sane tmpfs budget.
    client_max_body_size 25m;

    # Buffered request bodies spool to the image's default
    # /var/cache/nginx/client_temp. That directory is created by the image, so
    # nothing here depends on nginx being able to mkdir inside a read-only
    # container — the tmpfs backing it is simply sized for the real concurrency
    # in docker-compose.yml (client_max_body_size x limit_conn, plus headroom).
    #
    # An earlier revision pointed this at a new /tmp/client_temp. That is very
    # probably fine — nginx creates and chowns configured temp paths at startup
    # — but "very probably" is not something to discover in production on a
    # read-only filesystem, and the default path costs nothing.

    # Slowloris defence: a client that opens a connection and dribbles out the
    # request holds a worker slot until one of these fires.
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    # No more than this many simultaneous connections from one client.
    limit_conn conn_per_ip 20;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Only the verbs this app actually uses.
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }

    # --- Security headers -------------------------------------------------
    # These apply to the static frontend, which is where the CSP matters most:
    # the results renderer builds HTML out of values taken from an
    # attacker-supplied email, so script-src 'self' with no 'unsafe-inline'
    # turns an escaping slip from stored XSS into a blocked console message.
    # Kept in sync with _build_csp() in ataram-backend/app/__init__.py.
    #
    # 'unsafe-inline' appears under style-src only: the markup uses style
    # attributes throughout, and inline styles are a far weaker vector than
    # inline scripts. The policy names no third-party origin at all — the
    # Google Fonts webfont was removed in favour of the system font stack.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # X-XSS-Protection is deprecated and its filter has itself been exploitable;
    # 0 is what current guidance recommends.
    add_header X-XSS-Protection "0" always;
    # TLS terminates at Cloudflare and the tunnel is HTTPS end to end, so HSTS
    # is safe to assert here. Add `preload` only after the domain is submitted.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Local liveness probe for the docker healthcheck. Deliberately NOT proxied,
    # so nginx is reported healthy even while the backend is restarting.
    location = /healthz {
        access_log off;
        # Cheap, but unlimited and unlogged is still a free amplifier.
        limit_req zone=general burst=10 nodelay;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Never serve dotfiles, VCS metadata or editor leftovers. The frontend is
    # bind-mounted from a working copy that contains a .git directory.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(git|env|bak|swp|orig|log|ini|conf|yml|yaml|toml)$ {
        deny all;
        return 404;
    }

    # The analysis endpoint — the expensive one. burst=5 absorbs a legitimate
    # double-click; nodelay serves the burst immediately rather than queueing.
    location = /api/analyze {
        limit_req zone=analyze burst=5 nodelay;
        # Concurrent uploads are what size the body-spool tmpfs, so bound them
        # per client independently of the request rate.
        limit_conn conn_per_ip 4;

        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Single value, not $proxy_add_x_forwarded_for — see the $real_client_ip
        # map above. Appending breaks ProxyFix's rightmost-entry read.
        proxy_set_header X-Forwarded-For $real_client_ip;
        # TLS terminates at Cloudflare and the tunnel is HTTPS end to end, so
        # $scheme on this leg is 'http' and would be misleading.
        proxy_set_header X-Forwarded-Proto https;
        # WHOIS + DNS lookups on a cold cache can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        # Request buffering stays ON for the expensive endpoint. With it off,
        # nginx streams the body straight through and a client dribbling out an
        # upload holds a gunicorn worker — one of only four — for the whole
        # transfer, which is slowloris against the scarcest resource in the
        # stack. Buffered, nginx absorbs the slow client and the worker is only
        # occupied once the complete body has arrived.
        proxy_request_buffering on;
        client_body_buffer_size 256k;
    }

    # Backend API — same origin as the frontend, so no CORS preflight is involved.
    location /api/ {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Single value, not $proxy_add_x_forwarded_for — see the $real_client_ip
        # map above. Appending breaks ProxyFix's rightmost-entry read.
        proxy_set_header X-Forwarded-For $real_client_ip;
        # TLS terminates at Cloudflare and the tunnel is HTTPS end to end, so
        # $scheme on this leg is 'http' and would be misleading.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    location = /health {
        access_log off;
        # Exempt from the app's limiter, so it needs a limit here or it is a
        # free unlogged proxied endpoint for anyone to hammer.
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Single value, not $proxy_add_x_forwarded_for — see the $real_client_ip
        # map above. Appending breaks ProxyFix's rightmost-entry read.
        proxy_set_header X-Forwarded-For $real_client_ip;
        # TLS terminates at Cloudflare and the tunnel is HTTPS end to end, so
        # $scheme on this leg is 'http' and would be misleading.
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2)$ {
        expires 1h;
        # Regex locations inherit no limit_req from the server block, so the
        # static tree was the one unlimited path through nginx.
        limit_req zone=general burst=40 nodelay;
        add_header Cache-Control "public";
        # An add_header in a nested block REPLACES the parent's entire set
        # rather than adding to it, so every header must be repeated verbatim.
        # An SVG served without CSP and X-Frame-Options is directly navigable
        # and renders as a document, which makes the omission exploitable
        # rather than merely untidy.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
